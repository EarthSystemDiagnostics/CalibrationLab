# ============================================================
#  Bath hardware + tuning  -  FIXED for the Isotech Libra 785
#  Same key: value format as the parameter file. These rarely change; the
#  per-experiment parameter file only carries the plateaus and dwell times.
#  Any of these keys may be overridden in the parameter file if ever needed.
#  Used only by calibration_auto.py.
# ============================================================

# ---- Bath controller (Eurotherm 3504 via EI-Bisynch on the RS422 link) ----
bath_port:      usbserial-FT3GCNKB1
bath_protocol:  bisynch          # bisynch (3504) | modbus (over-temp / 2000-series)
bath_address:   1                # Bisynch GID/UID (3504) ; Modbus slave otherwise
bath_encoding:  int1             # modbus-only value scaling (ignored for bisynch)

# ---- Approach ramp (deg C/min) ----
# The Libra 785 slews only ~2 C/min and overshoots at full power, so the limit
# only bites below ~2. Overshoot ~= dead_time x rate; 1 -> ~1 C. Empty = max speed.
ramp_c_per_min: 1

# ---- Arrival / stability detection ----
# The bath PV fluctuates ~+/-0.03 C short-term; 0.05 lets it settle cleanly.
stability_tol:              0.05   # deg C band around the setpoint
stability_window:          10      # minutes PV must stay in band before measuring
stability_timeout_per_10k: 30      # max wait scales: minutes per 10 K of travel
stability_timeout_min:     15      # floor (minutes) for small/zero steps
